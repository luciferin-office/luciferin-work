<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data: blob:; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<style>
/* 1.0.5 · 화면 영역 고르기 — 찍어 둔 화면을 꽉 채워 보여 주고 끌어서 고름 */
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;cursor:crosshair;font-family:"Pretendard","Malgun Gothic","Apple SD Gothic Neo",sans-serif;-webkit-user-select:none;user-select:none;background:#000}
#bg{position:fixed;inset:0;width:100%;height:100%;object-fit:fill;pointer-events:none}
#dim{position:fixed;inset:0;background:rgba(15,23,42,.45)}
#sel{position:fixed;display:none;outline:2px dashed #E9D6A8;box-shadow:0 0 0 9999px rgba(15,23,42,.45);background:transparent}
body.has #dim{display:none}
#sz{position:fixed;display:none;background:rgba(31,48,96,.95);color:#fff;font-size:12.5px;font-weight:700;padding:5px 10px;border-radius:7px}
#hint{position:fixed;left:50%;top:18px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:rgba(31,48,96,.96);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;font-weight:700;box-shadow:0 10px 26px rgba(0,0,0,.3);white-space:nowrap;cursor:default}
#hint span{color:#E9D6A8;font-weight:600;font-size:12.5px}
#bar{position:fixed;display:none;gap:6px;background:#fff;border-radius:12px;padding:6px;box-shadow:0 12px 30px rgba(15,23,42,.3);cursor:default}
#bar button{all:unset;cursor:pointer;height:36px;padding:0 13px;border-radius:9px;font-size:13px;font-weight:700;color:#1F3060;border:1px solid #E5E9F2;display:flex;align-items:center}
#bar button.go{background:linear-gradient(135deg,#2B3F7A,#1F3060);color:#fff;border:0;font-weight:800}
#bar button.x{border:0;color:#5F6E88}
</style></head><body><img id="bg" alt=""><div id="dim"></div><div id="sel"></div><div id="sz"></div>
<div id="hint">보낼 영역을 끌어서 고르십시오 <span id="to"></span></div>
<div id="bar"><button class="go" id="go">이 영역 보내기</button><button id="re">다시 고르기</button><button class="x" id="cx">Esc 취소</button></div>
<script>
const q = new URLSearchParams(location.search); document.getElementById('to').textContent = (q.get('room') ? q.get('room') + ' 방으로 갑니다 · ' : '') + 'Esc 취소';
cap.img(u => { document.getElementById('bg').src = u; });
let a = null, r = null, drag = false; const sel = document.getElementById('sel'), sz = document.getElementById('sz'), bar = document.getElementById('bar');
const show = () => { if(!r || r.w < 4 || r.h < 4){ sel.style.display = sz.style.display = 'none'; document.body.classList.remove('has'); return; } document.body.classList.add('has');
  Object.assign(sel.style, { display: 'block', left: r.x + 'px', top: r.y + 'px', width: r.w + 'px', height: r.h + 'px' }); sz.textContent = `${Math.round(r.w)} × ${Math.round(r.h)}`; Object.assign(sz.style, { display: 'block', left: r.x + 'px', top: Math.max(4, r.y - 32) + 'px' }); };
const place = () => { bar.style.display = 'flex'; const bw = bar.offsetWidth, bh = bar.offsetHeight; let x = Math.min(r.x, innerWidth - bw - 8), y = r.y + r.h + 10; if(y + bh > innerHeight - 8) y = Math.max(8, r.y - bh - 10); bar.style.left = Math.max(8, x) + 'px'; bar.style.top = y + 'px'; };
document.addEventListener('mousedown', e => { if(e.button !== 0 || e.target.closest('#bar,#hint')) return; drag = true; bar.style.display = 'none'; a = { x: e.clientX, y: e.clientY }; r = { x: a.x, y: a.y, w: 0, h: 0 }; show(); });
document.addEventListener('mousemove', e => { if(!drag) return; r = { x: Math.min(a.x, e.clientX), y: Math.min(a.y, e.clientY), w: Math.abs(e.clientX - a.x), h: Math.abs(e.clientY - a.y) }; show(); });
document.addEventListener('mouseup', () => { if(!drag) return; drag = false; if(r && r.w >= 8 && r.h >= 8) place(); else { r = null; show(); } });
document.getElementById('go').onclick = () => { if(r) cap.done({ x: r.x, y: r.y, w: r.w, h: r.h, vw: innerWidth, vh: innerHeight }); };
document.getElementById('re').onclick = () => { r = null; bar.style.display = 'none'; show(); };
document.getElementById('cx').onclick = () => cap.done(null);
document.addEventListener('keydown', e => { if(e.key === 'Escape') cap.done(null); if(e.key === 'Enter' && r) cap.done({ x: r.x, y: r.y, w: r.w, h: r.h, vw: innerWidth, vh: innerHeight }); });
</script></body></html>
